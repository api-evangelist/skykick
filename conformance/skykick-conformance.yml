note: >-
  Standards conformance is asserted only where a provider page states it or a live
  probe demonstrated it. SkyKick publishes no OpenAPI, so nothing here is derived
  from a spec. The certification entries are quoted from the ConnectWise Trust
  Center compliance page, which names the former SkyKick services explicitly rather
  than covering them by implication.
standards:
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  profile: client_credentials grant (section 4.4)
  evidence: >-
    The provider's Get Started page documents a POST to
    https://apis.cloudservices.connectwise.com/auth/token with
    Content-Type: application/x-www-form-urlencoded, grant_type=client_credentials,
    a scope parameter, and HTTP Basic client authentication using ClientId:Secret.
  source: https://skykick.developer.azure-api.net/getstarted
- id: rfc6750
  name: OAuth 2.0 Bearer Token Usage (RFC 6750)
  conforms: true
  evidence: >-
    Resource calls carry "Authorization: Bearer <token>", and an anonymous GET of
    /whoami returned 401 with "WWW-Authenticate: Bearer" (probed 2026-08-28).
  source: https://apis.cloudservices.connectwise.com/whoami
- id: oidc
  name: OpenID Connect
  conforms: false
