- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: false
  evidence: /.well-known/oauth-authorization-server returned 404 on every host (probed 2026-08-28).
- id: rfc9457
  name: Problem Details for HTTP APIs (RFC 9457)
  conforms: false
  evidence: >-
    Observed error bodies are proprietary JSON objects
    ({"statusCode":..,"message":..} at the gateway, {"Message":".."} at the
    backend) served as application/json, not application/problem+json.
- id: rfc9116
  name: security.txt (RFC 9116)
  conforms: false
