domain_standard:
  applicable: false
  note: >-
    Microsoft 365 backup and migration for managed service providers has no
    market-wide interchange standard of the SCIM/OData/HL7/ISO-20022 kind. The
    relevant interface is the Microsoft Graph / Exchange Online API surface SkyKick
    consumes on the customer's behalf, which is a dependency rather than a standard
    this contract declares. Reward-only check: no domain standard is claimed and
    none is invented.
