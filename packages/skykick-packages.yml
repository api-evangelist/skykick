note: >-
  SkyKick ships NO first-party client SDK for its API, in any language, on any
  registry. Every registry was queried unauthenticated on 2026-08-28: npm search
  for "skykick" returned zero packages, PyPI has no skykick project (404), and the
  only two SkyKick-authored packages that exist anywhere are a .NET logging helper
  and a set of forked OSS libraries in the GitHub org — none of which call the
  Partner Integration API. The three packages that DO wrap the API are all written
  by third-party MSP engineers. No `SDKs` pointer is wired into apis.yml as a
  result: sdk_count is a measure of what the provider publishes for its API, and
  crediting a community wrapper or a logfmt logger to SkyKick would be false.
