aid: skykick
name: SkyKick
description: 'SkyKick is a Seattle-based cloud automation company whose Microsoft 365
  migration, cloud backup, SaaS security and cloud automation products for managed
  service providers were acquired by ConnectWise in September 2024. The SkyKick brand''s
  own domain no longer serves a website — skykick.com answers HTTP 404 "Site Not Configured"
  and www.skykick.com no longer resolves — and the products now ship as ConnectWise
  Cloud Backup and ConnectWise SaaS Security. The SkyKick Partner Integration API is
  still live, on ConnectWise Cloud Services: an Azure API Management gateway at
  apis.cloudservices.connectwise.com, fronted by the ConnectWise Developer Portal
  running on SkyKick''s own APIM instance (skykick.developer.azure-api.net, also served
  as developers.cloudservices.connectwise.com). Authentication is OAuth 2.0 client
  credentials plus an Azure APIM subscription key. The API reference itself is gated:
  developer access must be provisioned by an administrator inside the Cloud Services
  partner portal, so no OpenAPI, AsyncAPI, MCP server or agent card is published
  anonymously.'
