apis:
- name: SkyKick Partner Integration API
  description: 'The Partner Integration API is the SkyKick / ConnectWise Cloud Services
    partner-facing REST API. The provider''s own Get Started page documents an OAuth
    2.0 client-credentials token exchange at /auth/token with the scopes Partner and
    Distributor, an Azure API Management subscription key sent as Ocp-Apim-Subscription-Key,
    and a /whoami identity call. Backup resources (subscriptions, autodiscover,
    datacenters, Exchange mailboxes) sit under /Backup. The gateway answers live but
    every resource requires authorization; the operation-level reference is behind
    the developer portal sign-in.'
